<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Daftar Buku</title>
    <link rel="stylesheet" href="../assets/css/style.css">
  </head>
  <body>
    <header>
      <h1>SIMPUS-Mini</h1>
      <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Buka/tutup menu navigasi" aria-controls="menu-utama" aria-expanded="false">&#9776;</button>
        <nav id="menu-utama" aria-label="Navigasi utama">

    <main>
      <section>
        <h2>Daftar Buku</h2>
        <a href="tambah.html" class="btn-tambah">Tambah Buku</a>
        <div class="search-box">
          <label for="search-input">Cari Judul Buku</label>
          <input type="text" id="search-input" placeholder="Ketik judul buku...">

        <table>
          <thead>
            <tr>
              <th>Judul</th>
              <th>Pengarang</th>
              <th>Tahun</th>
              <th>Stok</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            <!-- Baris buku diisi oleh assets/js/buku.js -->
          </tbody>
        </table>
        </div>
      </section>

    <footer>
